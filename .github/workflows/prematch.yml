name: pre-kick-off prices and line-ups

on:
  schedule:
    - cron: "*/15 * * * *"  # every 15 minutes; exits at once when no big-5 match starts within 80 minutes
  workflow_dispatch:
  push:
    branches: [main]
    paths: [prematch.py, .github/workflows/prematch.yml]

permissions:
  contents: write

concurrency:
  group: fetch            # shares the queue with the daily fetch, so the two never push at the same time
  cancel-in-progress: false

jobs:
  prematch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: anything due?
        id: due
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import csv, datetime as dt
          from zoneinfo import ZoneInfo
          now = dt.datetime.now(dt.timezone.utc); due = 0
          for r in csv.DictReader(open("data/fixtures.csv", encoding="utf-8-sig")):
              if r.get("Div") in ("E0", "SP1", "I1", "D1", "F1") and r.get("Date"):
                  d = dt.datetime.strptime(r["Date"].strip(), "%d/%m/%Y")
                  hh, mm = (r.get("Time") or "15:00").split(":")[:2]
                  ko = d.replace(hour=int(hh), minute=int(mm), tzinfo=ZoneInfo("Europe/London")).astimezone(dt.timezone.utc)
                  due += now < ko <= now + dt.timedelta(minutes=80)
          print(f"due={due}")
          PY
      - if: steps.due.outputs.due != '0'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.due.outputs.due != '0'
        run: pip install requests pandas numpy scipy
      - if: steps.due.outputs.due != '0'
        run: python prematch.py
        env:
          ODDS_KEY: ${{ secrets.ODDS_KEY }}
      - if: steps.due.outputs.due != '0'
        name: commit
        run: |
          git config user.name "footquant prematch"
          git config user.email "prematch@footquant.local"
          git add data/prematch.json data/lineups_cache.json data/prematch.log 2>/dev/null || true
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "prematch $(date -u +'%Y-%m-%d %H:%M')" && git pull --rebase && git push; fi
